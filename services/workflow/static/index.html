<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoreAIgent — Kamu Evrak Asistanı</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ince scrollbar */
    .chat-scroll::-webkit-scrollbar { width: 6px; }
    .chat-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
    .chat-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
    .chat-scroll { scrollbar-width: thin; scrollbar-color: #cbd5e1 #f1f5f9; }
    .bubble { transition: all 0.2s ease; }
    .typing-indicator { display: inline-block; width: 8px; height: 8px; background: #94a3b8; border-radius: 50%; margin-right: 4px; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
  </style>
</head>
<body class="bg-slate-100 h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="bg-white/80 backdrop-blur border-b border-slate-200 px-4 py-2.5 shadow-sm z-10">
    <div class="max-w-3xl mx-auto flex items-center gap-2">
      <span class="text-xl">🏛️</span>
      <h1 class="font-semibold text-slate-800 text-sm sm:text-base">CoreAIgent — Kamu Evrak Asistanı</h1>
    </div>
  </header>

  <!-- Chat alanı -->
  <main id="chatContainer" class="flex-1 overflow-y-auto chat-scroll px-4 py-6 bg-slate-100">
    <div id="messagesWrapper" class="max-w-3xl mx-auto space-y-4">
      <!-- Mesajlar JS ile buraya eklenecek -->
    </div>
  </main>

  <!-- Alt input çubuğu -->
  <footer class="bg-white border-t border-slate-200 px-4 py-3 z-10">
    <div class="max-w-3xl mx-auto flex items-center gap-2">
      <!-- Ataş butonu -->
      <label class="cursor-pointer p-2 rounded-full hover:bg-slate-100 transition flex items-center justify-center text-slate-500" title="Dosya ekle (PDF, PNG, JPG)">
        <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg" class="hidden">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
        </svg>
      </label>
      <!-- Metin input -->
      <input type="text" id="messageInput" placeholder="Evrak metnini yapıştırın veya 📎 ile dosya ekleyin..." 
             class="flex-1 border border-slate-300 rounded-full px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-slate-50">
      <!-- Gönder butonu -->
      <button id="sendButton" class="bg-blue-600 hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed text-white rounded-full p-2.5 transition shadow-sm flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
        </svg>
      </button>
    </div>
  </footer>

  <script>
    (function() {
      // DOM elemanları
      const messagesWrapper = document.getElementById('messagesWrapper');
      const chatContainer = document.getElementById('chatContainer');
      const messageInput = document.getElementById('messageInput');
      const sendButton = document.getElementById('sendButton');
      const fileInput = document.getElementById('fileInput');

      // Durum
      let isProcessing = false;

      // Türkçe haritalar
      const statusMap = {
        completed: 'Tamamlandı ✅',
        needs_information: 'Eksik Bilgi ⚠️',
        rejected: 'Reddedildi ❌',
        manual_review: 'Manuel İnceleme Gerekli 🔎'
      };
      const docTypeMap = {
        petition: 'Dilekçe',
        application: 'Başvuru Formu',
        complaint: 'Şikayet Dilekçesi',
        information_request: 'Bilgi Edinme Başvurusu',
        official_letter: 'Resmi Yazı',
        invoice: 'Fatura',
        unsupported: 'Desteklenmeyen'
      };
      const deptMap = {
        insan_kaynaklari: 'İnsan Kaynakları',
        hukuk: 'Hukuk',
        mali_hizmetler: 'Mali Hizmetler',
        yazi_isleri: 'Yazı İşleri',
        bilgi_islem: 'Bilgi İşlem',
        destek_hizmetleri: 'Destek Hizmetleri',
        vatandas_hizmetleri: 'Vatandaş Hizmetleri',
        manual_review: 'Manuel İnceleme'
      };

      // Basit markdown dönüştürücü (kalın, liste, paragraf)
      function simpleMarkdownToHtml(md) {
        if (!md) return '';
        // escape HTML önce
        let escaped = md.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        
        // **kalın** -> <strong>
        escaped = escaped.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        
        // satır bazlı işleme
        const lines = escaped.split('\n');
        let html = '';
        let inList = false;
        
        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          const trimmed = line.trim();
          
          // liste maddesi
          if (trimmed.startsWith('- ')) {
            if (!inList) {
              html += '<ul class="list-disc ml-5 space-y-1 my-1">';
              inList = true;
            }
            html += `<li>${trimmed.substring(2)}</li>`;
            continue;
          } else {
            if (inList) {
              html += '</ul>';
              inList = false;
            }
          }
          
          // boş satır -> paragraf arası boşluk
          if (trimmed === '') {
            html += '<div class="h-2"></div>';
            continue;
          }
          
          // normal satır
          html += `<p>${line}</p>`;
        }
        if (inList) html += '</ul>';
        
        return html;
      }

      // Mesaj ekleme (kullanıcı veya bot)
      function addMessage(role, contentHTML, isBot = false) {
        const wrapper = document.createElement('div');
        wrapper.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'} items-end gap-2`;
        
        // avatar
        const avatar = document.createElement('div');
        avatar.className = `w-8 h-8 rounded-full flex items-center justify-center text-lg shadow-sm ${role === 'user' ? 'bg-blue-100 order-2' : 'bg-slate-200 order-1'}`;
        avatar.textContent = role === 'user' ? '👤' : '🤖';
        
        // baloncuk
        const bubble = document.createElement('div');
        bubble.className = `bubble max-w-[75%] px-4 py-2.5 rounded-2xl shadow-sm text-sm leading-relaxed ${
          role === 'user' 
            ? 'bg-blue-600 text-white rounded-br-md order-1' 
            : 'bg-white text-slate-800 border border-slate-200 rounded-bl-md order-2'
        }`;
        
        if (typeof contentHTML === 'string') {
          bubble.innerHTML = contentHTML;
        } else {
          bubble.appendChild(contentHTML);
        }
        
        wrapper.appendChild(avatar);
        wrapper.appendChild(bubble);
        messagesWrapper.appendChild(wrapper);
        
        // scroll en alta
        chatContainer.scrollTop = chatContainer.scrollHeight;
        
        return bubble; // güncelleme için döndür
      }

      // Bot işleniyor baloncuğu (pulse animasyonlu)
      function addProcessingBubble() {
        const bubble = addMessage('bot', '<span class="inline-flex items-center gap-1"><span class="typing-indicator"></span><span class="typing-indicator" style="animation-delay:0.2s"></span><span class="typing-indicator" style="animation-delay:0.4s"></span> Evrakınızı aldım, okuyorum... ⏳</span>', true);
        return bubble;
      }

      // Hata mesajı güncelleme
      function setBubbleError(bubble, errorMsg) {
        bubble.innerHTML = `<span class="text-red-600 font-medium">⚠️ Bir hata oluştu: ${errorMsg}. Lütfen tekrar deneyin.</span>`;
        bubble.classList.add('border-red-200', 'bg-red-50');
      }

      // Sonuç baloncuğunu güncelle
      function updateBubbleWithResult(bubble, data) {
        // Durum ve tür
        const statusKey = data.status || 'manual_review';
        const docTypeKey = data.documentType || 'unsupported';
        const deptKey = data.department || 'manual_review';
        
        const statusText = statusMap[statusKey] || statusKey;
        const docTypeText = docTypeMap[docTypeKey] || docTypeKey;
        const deptText = deptMap[deptKey] || deptKey;
        const confidence = data.confidence ? Math.round(data.confidence * 100) : 0;
        
        // Eksik bilgiler
        let missingItems = '';
        if (data.missingFields && data.missingFields.length > 0) {
          missingItems = data.missingFields.map(f => `- ${f}`).join('\n');
        } else {
          missingItems = '- Eksik bilgi tespit edilmedi ✅';
        }
        
        // Çelişkiler
        let contradictionsSection = '';
        if (data.conflicts && data.conflicts.length > 0) {
          const items = data.conflicts.map(c => `- ${c}`).join('\n');
          contradictionsSection = `\n\n**Çelişkiler:**\n${items}`;
        }
        
        // Markdown şablonu
        const md = `**Durum:** ${statusText}\n\n**Evrak Türü:** ${docTypeText}\n**Yönlendirilen Birim:** ${deptText}\n**Güven Skoru:** %${confidence}\n\n**Özet:** ${data.summary || '—'}\n\n**Eksik Bilgiler:**\n${missingItems}${contradictionsSection}`;
        
        const htmlContent = simpleMarkdownToHtml(md);
        
        // Taslak metin varsa ekle
        let draftHtml = '';
        if (data.draft && data.draft.trim().length > 0) {
          const draftId = 'draft_' + Math.random().toString(36).substring(2, 9);
          draftHtml = `
            <div class="mt-4 border-t border-slate-200 pt-3">
              <div class="flex items-center justify-between mb-2">
                <span class="font-semibold text-slate-700 text-sm">📝 Taslak Metin</span>
                <div class="flex gap-2">
                  <button class="copy-draft-btn text-xs bg-slate-100 hover:bg-slate-200 px-2 py-1 rounded-md transition" data-draft-id="${draftId}">📋 Kopyala</button>
                  <button class="toggle-draft-btn text-xs bg-slate-100 hover:bg-slate-200 px-2 py-1 rounded-md transition" data-draft-id="${draftId}">✏️ Düzenle</button>
                </div>
              </div>
              <textarea id="${draftId}" rows="4" readonly class="w-full border border-slate-300 rounded-lg p-2 text-xs bg-slate-50 focus:outline-none focus:ring-1 focus:ring-blue-400">${data.draft}</textarea>
            </div>
          `;
        }
        
        // Hata varsa ekle
        let errorHtml = '';
        if (data.error && data.error.message) {
          errorHtml = `<div class="mt-3 text-red-600 text-sm font-medium">⚠️ Hata: ${data.error.message}</div>`;
        }
        
        bubble.innerHTML = htmlContent + draftHtml + errorHtml;
        
        // Kopyala ve düzenle butonları için event listener
        if (data.draft) {
          const draftId = 'draft_' + bubble.querySelector('textarea')?.id.split('_')[1];
          const copyBtn = bubble.querySelector('.copy-draft-btn');
          const toggleBtn = bubble.querySelector('.toggle-draft-btn');
          const textarea = bubble.querySelector('textarea');
          
          if (copyBtn && textarea) {
            copyBtn.addEventListener('click', () => {
              navigator.clipboard.writeText(textarea.value).then(() => {
                copyBtn.textContent = '✅ Kopyalandı';
                setTimeout(() => copyBtn.textContent = '📋 Kopyala', 1500);
              });
            });
          }
          
          if (toggleBtn && textarea) {
            toggleBtn.addEventListener('click', () => {
              if (textarea.readOnly) {
                textarea.readOnly = false;
                textarea.classList.remove('bg-slate-50');
                textarea.classList.add('bg-white');
                toggleBtn.textContent = '🔒 Kilitle';
              } else {
                textarea.readOnly = true;
                textarea.classList.add('bg-slate-50');
                textarea.classList.remove('bg-white');
                toggleBtn.textContent = '✏️ Düzenle';
              }
            });
          }
        }
        
        // scroll güncelle
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }

      // Dosyayı base64 chunk'larına çevir
      function fileToBase64Chunked(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            const arrayBuffer = reader.result;
            const bytes = new Uint8Array(arrayBuffer);
            let binary = '';
            const chunkSize = 8192;
            for (let i = 0; i < bytes.length; i += chunkSize) {
              const chunk = bytes.subarray(i, i + chunkSize);
              binary += String.fromCharCode.apply(null, chunk);
            }
            resolve(btoa(binary));
          };
          reader.onerror = () => reject(new Error('Dosya okunamadı'));
          reader.readAsArrayBuffer(file);
        });
      }

      // MIME tipi belirle
      function getContentType(file) {
        const mime = file.type;
        if (mime === 'application/pdf') return 'application/pdf';
        if (mime === 'image/png') return 'image/png';
        if (mime === 'image/jpeg') return 'image/jpeg';
        // uzantıya bak
        const ext = file.name.split('.').pop().toLowerCase();
        if (ext === 'pdf') return 'application/pdf';
        if (ext === 'png') return 'image/png';
        if (ext === 'jpg' || ext === 'jpeg') return 'image/jpeg';
        return 'application/octet-stream';
      }

      // Ana gönderim fonksiyonu
      async function handleSend(content, contentType, fileName = null) {
        if (isProcessing) return;
        if (!content && !fileName) return;
        
        // Kullanıcı baloncuğu
        if (fileName) {
          addMessage('user', `📎 ${fileName} gönderildi`);
        } else {
          addMessage('user', content.replace(/\n/g, '<br>'));
        }
        
        // Input temizle
        messageInput.value = '';
        
        // İşleniyor baloncuğu
        const processingBubble = addProcessingBubble();
        
        // UI kilitle
        isProcessing = true;
        sendButton.disabled = true;
        messageInput.disabled = true;
        fileInput.disabled = true;
        
        // requestId ve documentId
        const requestId = crypto.randomUUID ? crypto.randomUUID() : 'req_' + Date.now() + Math.random().toString(36).substring(2, 10);
        const documentId = crypto.randomUUID ? crypto.randomUUID() : 'doc_' + Date.now() + Math.random().toString(36).substring(2, 10);
        
        // content hazırla
        let finalContent = content;
        if (fileName) {
          try {
            finalContent = await fileToBase64Chunked(fileInput.files[0]);
          } catch (e) {
            setBubbleError(processingBubble, 'Dosya okunamadı');
            isProcessing = false;
            sendButton.disabled = false;
            messageInput.disabled = false;
            fileInput.disabled = false;
            return;
          }
        }
        
        const payload = {
          schemaVersion: '1.0',
          requestId,
          documentId,
          scenarioId: 'chat',
          contentType,
          content: finalContent,
          fileName: fileName || undefined,
          source: 'citizen_portal'
        };
        
        try {
          // POST /upload
          const uploadRes = await fetch('/upload', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          
          if (!uploadRes.ok) {
            throw new Error(`Upload başarısız (${uploadRes.status})`);
          }
          
          const uploadData = await uploadRes.json();
          const workflowId = uploadData.workflowId;
          
          // GET /result/{workflowId}
          const resultRes = await fetch(`/result/${workflowId}`);
          if (!resultRes.ok) {
            throw new Error(`Sonuç alınamadı (${resultRes.status})`);
          }
          
          const resultData = await resultRes.json();
          
          // Baloncuğu güncelle
          updateBubbleWithResult(processingBubble, resultData);
          
        } catch (err) {
          setBubbleError(processingBubble, err.message || 'Bilinmeyen hata');
        } finally {
          isProcessing = false;
          sendButton.disabled = false;
          messageInput.disabled = false;
          fileInput.disabled = false;
          fileInput.value = ''; // dosya input temizle
          chatContainer.scrollTop = chatContainer.scrollHeight;
        }
      }

      // Event listeners
      sendButton.addEventListener('click', () => {
        const text = messageInput.value.trim();
        if (text) {
          handleSend(text, 'text/plain');
        }
      });

      messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          const text = messageInput.value.trim();
          if (text) {
            handleSend(text, 'text/plain');
          }
        }
      });

      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const contentType = getContentType(file);
        handleSend('', contentType, file.name);
      });

      // Karşılama mesajı
      window.addEventListener('load', () => {
        const welcome = "Merhaba! Ben CoreAIgent. Bana bir kamu evrağı (dilekçe, başvuru vb.) metnini yapıştırın ya da 📎 ile PDF/görsel yükleyin, sizin için okuyup sınıflandırayım, eksikleri kontrol edeyim, ilgili birime yönlendireyim ve taslak yazı hazırlayayım.";
        addMessage('bot', welcome);
      });

    })();
  </script>
</body>
</html>
