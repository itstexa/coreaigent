name: coreaigent
x-mock: &mock
  build:
    context: .
    dockerfile: mocks/Dockerfile
  image: coreaigent/contract-mock:1.0
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready')"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 2s

services:
  ocr:
    <<: *mock
    image: coreaigent/ocr-mock:1.0
    environment: { MOCK_SERVICE: ocr }
    ports: ["8081:8080"]
  analysis:
    <<: *mock
    image: coreaigent/analysis-mock:1.0
    environment: { MOCK_SERVICE: analysis }
    ports: ["8082:8080"]
  rag:
    <<: *mock
    image: coreaigent/rag-mock:1.0
    environment: { MOCK_SERVICE: rag }
    ports: ["8083:8080"]
  llm:
    <<: *mock
    image: coreaigent/llm-mock:1.0
    environment: { MOCK_SERVICE: llm }
    ports: ["8084:8080"]
  workflow:
    <<: *mock
    image: coreaigent/workflow-mock:1.0
    environment: { MOCK_SERVICE: workflow }
    ports: ["8085:8080"]
  contract-tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    image: coreaigent/contract-tests:1.0
    profiles: ["tests"]
    depends_on:
      ocr: { condition: service_healthy }
      analysis: { condition: service_healthy }
      rag: { condition: service_healthy }
      llm: { condition: service_healthy }
      workflow: { condition: service_healthy }
