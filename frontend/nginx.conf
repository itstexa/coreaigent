server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compose overlays recreate the service containers behind these names, so the
  # upstream address must be resolved per request through Docker's embedded DNS.
  # A hostname written literally in proxy_pass is resolved once at startup, and
  # a recycled address can then route real UI traffic into whatever container
  # inherited that IP -- including the contract mocks.
  resolver 127.0.0.11 ipv6=off valid=10s;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location /api/real/ {
    set $upstream_real host.docker.internal;
    rewrite ^/api/real/(.*)$ /$1 break;
    proxy_pass http://$upstream_real:8080;
    proxy_set_header Host $host;
  }

  location /api/ocr/ {
    set $upstream_ocr ocr;
    rewrite ^/api/ocr/(.*)$ /$1 break;
    proxy_pass http://$upstream_ocr:8080;
    proxy_set_header Host $host;
  }

  location /api/classification/ {
    set $upstream_classification classification;
    rewrite ^/api/classification/(.*)$ /$1 break;
    proxy_pass http://$upstream_classification:8080;
    proxy_set_header Host $host;
  }

  location /api/validation/ {
    set $upstream_validation validation;
    rewrite ^/api/validation/(.*)$ /$1 break;
    proxy_pass http://$upstream_validation:8080;
    proxy_set_header Host $host;
  }

  # RAG and Jamba are internal workflow dependencies, but exposing their
  # readiness through the same proxy lets the operator badge report the full
  # six-service closure instead of implying that only four services exist.
  location /api/rag/ {
    set $upstream_rag rag;
    rewrite ^/api/rag/(.*)$ /$1 break;
    proxy_pass http://$upstream_rag:8080;
    proxy_set_header Host $host;
  }

  location /api/llm/ {
    set $upstream_llm llm;
    rewrite ^/api/llm/(.*)$ /$1 break;
    proxy_pass http://$upstream_llm:8080;
    proxy_set_header Host $host;
  }

  location /api/validation-user/ {
    set $upstream_validation_user validation;
    rewrite ^/api/validation-user/(.*)$ /$1 break;
    proxy_pass http://$upstream_validation_user:8080;
    proxy_set_header Host $host;
    proxy_set_header Authorization "Bearer f03-demo-token";
  }

  location /api/workflow-user/ {
    set $upstream_workflow_user workflow;
    rewrite ^/api/workflow-user/(.*)$ /$1 break;
    proxy_pass http://$upstream_workflow_user:8080;
    proxy_set_header Host $host;
    proxy_set_header Authorization "Bearer f03-demo-token";
  }

  location /api/workflow-admin/ {
    set $upstream_workflow_admin workflow;
    rewrite ^/api/workflow-admin/(.*)$ /$1 break;
    proxy_pass http://$upstream_workflow_admin:8080;
    proxy_set_header Host $host;
    proxy_set_header Authorization "Bearer f06-demo-admin-token";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
