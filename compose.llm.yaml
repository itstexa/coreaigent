services:
  llm:
    build:
      context: ./services/llm
      dockerfile: Dockerfile
    image: coreaigent/llm:jamba-local
    gpus: all
    environment:
      MOCK_SERVICE: null
      MODEL_ID: "${MODEL_ID:-ai21labs/AI21-Jamba2-3B}"
      MODEL_REVISION: "${MODEL_REVISION:-525c6c8e1d9f5bddedfbdc1dbb0ade2df84230c9}"
      HF_HOME: "/var/cache/huggingface"
      HUGGINGFACE_HUB_CACHE: "/var/cache/huggingface"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-1}"
      # 1800 remains the validated service maximum.  A bounded default keeps
      # the single serialized GPU lane responsive when a model misses EOS.
      MAX_NEW_TOKENS: "${MAX_NEW_TOKENS:-512}"
      TEMPERATURE: "${TEMPERATURE:-0.0}"
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
    volumes:
      - "${HF_CACHE_DIR:-llm-hf-cache}:/var/cache/huggingface"

volumes:
  llm-hf-cache:
