services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coreaigent
      POSTGRES_USER: coreaigent
      POSTGRES_PASSWORD: coreaigent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coreaigent -d coreaigent"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - ocr-postgres-data:/var/lib/postgresql/data

  ocr:
    build:
      context: ./services/ocr
      dockerfile: Dockerfile
    image: coreaigent/ocr:local
    environment:
      MOCK_SERVICE: null
      DATABASE_URL: postgresql://coreaigent:coreaigent@postgres:5432/coreaigent
      HF_HUB_OFFLINE: "1"
      PADDLE_DET_MODEL_DIR: /var/cache/paddleocr/hub/models--PaddlePaddle--PP-OCRv5_mobile_det/snapshots/0d63e78e2b680928f6b1747d76a08db6e645efb7
      PADDLE_REC_MODEL_DIR: /var/cache/paddleocr/hub/models--PaddlePaddle--latin_PP-OCRv5_mobile_rec/snapshots/ab2cd5cc5fa6309be2e5acdfe66eca2c2c127d57
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ocr-model-cache:/var/cache/paddleocr:ro

  contract-tests:
    environment:
      DATABASE_URL: postgresql://coreaigent:coreaigent@postgres:5432/coreaigent

volumes:
  ocr-postgres-data:
  ocr-model-cache:
