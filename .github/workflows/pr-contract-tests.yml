name: PR contract mock tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  contract-mock-e2e:
    name: Contract and mock E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start contract mocks
        run: docker compose up --build -d

      - name: Run contract and mock E2E tests
        run: docker compose --profile tests run --build --rm contract-tests --mode mock

      - name: Print Compose logs after a failure
        if: failure()
        run: docker compose logs --no-color

      - name: Clean up Docker resources
        if: always()
        run: docker compose down --volumes --remove-orphans
